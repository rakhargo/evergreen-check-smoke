name: evergreen-check external smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    name: green · must pass
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: Fatihmaull/evergreen@2a4ab0a5a916ee156149c1f7e5a2ca8802c2fdc6
        with:
          contracts: CANZNTAW7DYMCZ6EAY5BP672H4AL2O2HVRBP4O4HRUEZRATHQRRLXL6L
          keys-file: a-data-keys.json
          threshold: '17280'
          version: '0.1.0'

  red:
    name: red · must fail at threshold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: Fatihmaull/evergreen@2a4ab0a5a916ee156149c1f7e5a2ca8802c2fdc6
        with:
          contracts: CANZNTAW7DYMCZ6EAY5BP672H4AL2O2HVRBP4O4HRUEZRATHQRRLXL6L
          keys-file: a-data-keys.json
          threshold: '2000000'
          version: '0.1.0'
